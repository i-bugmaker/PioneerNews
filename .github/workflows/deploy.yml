name: Deploy PioneerNews

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # Job 1: Docker 镜像构建并推送到 GitHub Container Registry
  # ============================================================
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 元数据（标签、描述等）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ============================================================
  # Job 2: SSH 部署到 Linux 服务器（可选，需要配置 Secrets）
  # ============================================================
  ssh-deploy:
    runs-on: ubuntu-latest
    needs: docker-build
    if: false
    # ↑ 如需启用，将 `if: false` 改为 `if: github.ref == 'refs/heads/main'`
    #    并在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置：
    #    - DEPLOY_HOST      服务器 IP 或域名
    #    - DEPLOY_PORT      SSH 端口（默认 22）
    #    - DEPLOY_USER      SSH 用户名
    #    - DEPLOY_KEY       SSH 私钥
    #    - DEPLOY_PATH      部署路径，例如 /opt/pioneernews

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 通过 SSH 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart pioneernews