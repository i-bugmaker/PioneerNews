<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>先锋新闻 - 领先的数据控制台</title>
    <script>!function(){const t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark')}();</script>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#8b5cf6">
    <link rel="stylesheet" href="/static/style.css?v=34">
</head>
<body>
    <div class="container">
        <header class="vanguard-header">
            <div class="brand-title">
                <img src="/static/favicon.png" class="brand-logomark" alt="Vanguard Logo" />
                <h1 class="metallic-text" data-text="先锋新闻">先锋新闻</h1>
            </div>
            <div class="header-info">
                <span id="current-time"></span>
                <span class="live-indicator">
                    <span class="live-dot"></span>
                    实时更新
                </span>
                <button class="theme-toggle" id="theme-toggle" aria-label="切换主题">
                    <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="author-badge" id="author-badge" aria-label="作者信息">
            <span class="badge-label">作者：</span>
            <span class="badge-text">股票批发王哥</span>
        </div>

        <div class="emoji-fly-container" id="emoji-fly-container"></div>

        <div class="search-bar-container">
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <input type="text" id="search-input" placeholder="搜索新闻关键词..." maxlength="100" autocomplete="off" />
                    <button id="search-clear" class="search-clear" aria-label="清除搜索"></button>
                    <button id="search-btn" class="search-btn-inline" aria-label="搜索">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="trending-section" id="trending-section" style="display:none;">
            <div class="trending-header" id="trending-header">
                <span class="trending-title">
                    <svg class="trending-title-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2C8 2 4 5 4 9c0 2.5 1.5 4.5 3 6l-1 3c0 1 1 2 2 2h8c1 0 2-1 2-2l-1-3c1.5-1.5 3-3.5 3-6 0-4-4-7-8-7z"/>
                        <path d="M9 13c0 0 1-1 1-2 0-1-1-2-1-2s1 1 1 2c0 1-1 2-1 2z"/>
                        <path d="M13 13c0 0 1-1 1-2 0-1-1-2-1-2s1 1 1 2c0 1-1 2-1 2z"/>
                        <path d="M11 15c-1 0-2-1-2-2h4c0 1-1 2-2 2z"/>
                    </svg>
                    24小时热点
                </span>
            </div>
            <div class="trending-cloud" id="trending-cloud"></div>
        </div>

        <main>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>正在加载新闻...</p>
            </div>

            <div id="news-container" class="news-container"></div>
            <div id="error-message" class="error-message" style="display: none;">
                <p>⚠️ 加载失败，请刷新重试</p>
            </div>

        </main>
    </div>
    <aside class="timeline-panel" id="timeline-panel">
        <div class="timeline-header">
            <div class="timeline-title-row">
                <svg class="timeline-title-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="10" cy="10" r="8"/><polyline points="10 5 10 10 14 12"/>
                </svg>
                <span class="timeline-title">事件日历</span>
                <span class="timeline-update-time" id="timeline-update-time"></span>
            </div>
            <div class="timeline-filters" id="timeline-filters"></div>
        </div>
        <div class="timeline-scroll" id="timeline-scroll"></div>
    </aside>
    <button class="timeline-toggle-btn" id="timeline-toggle-btn" aria-label="展开事件日历">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
    </button>
    <div class="scroll-float" id="scroll-float">
        <div class="sfb-export-wrap" id="sfb-export-wrap">
            <button class="scroll-float-btn sfb-export" id="sfb-export" aria-label="导出数据">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="7 10 12 15 17 10"/>
                    <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </button>
            <div class="export-float-panel" id="export-float-panel" style="display:none;">
                <div class="float-panel-arrow"></div>
                <div class="float-panel-body">
                    <div class="float-panel-title">
                        <svg class="fp-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                            <circle cx="12" cy="3" r="1" fill="currentColor"/>
                        </svg>
                        导出数据
                    </div>
                    <div class="float-panel-row">
                        <span class="float-panel-label">格式</span>
                        <div class="float-panel-fmts" id="float-panel-fmts">
                            <button class="fp-fmt active" data-format="json">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="5" x2="17" y2="5"/><line x1="7" y1="10" x2="17" y2="10"/><line x1="7" y1="15" x2="17" y2="15"/><circle cx="3" cy="5" r="1" fill="currentColor"/><circle cx="3" cy="10" r="1" fill="currentColor"/><circle cx="3" cy="15" r="1" fill="currentColor"/></svg>
                                <span>JSON</span>
                            </button>
                            <button class="fp-fmt" data-format="html">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 14 18 10 13 6"/><polyline points="7 6 2 10 7 14"/></svg>
                                <span>HTML</span>
                            </button>
                            <button class="fp-fmt" data-format="csv">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="15" height="15" rx="1.5"/><line x1="2.5" y1="7.5" x2="17.5" y2="7.5"/><line x1="2.5" y1="12.5" x2="17.5" y2="12.5"/><line x1="7.5" y1="2.5" x2="7.5" y2="17.5"/></svg>
                                <span>CSV</span>
                            </button>
                            <button class="fp-fmt" data-format="md">
                                <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5H5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="12 2.5 12 8 17.5 8"/><line x1="13.5" y1="12" x2="6.5" y2="12"/><line x1="13.5" y1="15" x2="6.5" y2="15"/></svg>
                                <span>MD</span>
                            </button>
                        </div>
                    </div>
                    <div class="float-panel-row">
                        <span class="float-panel-label">日期</span>
                        <div class="float-panel-dates">
                            <button class="fp-drp-trigger" id="fp-drp-trigger" type="button">
                                <svg class="fp-drp-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="14" rx="1.5"/><line x1="13" y1="1.5" x2="13" y2="5.5"/><line x1="7" y1="1.5" x2="7" y2="5.5"/><line x1="2.5" y1="8.5" x2="17.5" y2="8.5"/></svg>
                                <span class="fp-drp-label" id="fp-drp-label">选择日期范围</span>
                                <svg class="fp-drp-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5 8 10 13 15 8"/></svg>
                            </button>
                            <div class="fp-drp-calendar" id="fp-drp-calendar">
                                <div class="fp-drp-cal-hd">
                                    <button class="fp-drp-cal-nav" data-dir="-1" type="button" aria-label="上月">‹</button>
                                    <span class="fp-drp-cal-title" id="fp-drp-cal-title"></span>
                                    <button class="fp-drp-cal-nav" data-dir="1" type="button" aria-label="下月">›</button>
                                </div>
                                <div class="fp-drp-cal-weeks"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
                                <div class="fp-drp-cal-grid" id="fp-drp-cal-grid"></div>
                                <div class="fp-drp-cal-ft">
                                    <span id="fp-drp-cal-hint">选择开始日期</span>
                                </div>
                            </div>
                            <input type="date" id="fp-export-start" class="fp-drp-hidden-input" />
                            <input type="date" id="fp-export-end" class="fp-drp-hidden-input" />
                        </div>
                    </div>
                    <button class="float-panel-export-btn" id="fp-btn-export">
                        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15.5 11v3.5a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2V11"/>
                            <polyline points="5.5 7.5 9 11 12.5 7.5"/>
                            <line x1="9" y1="11" x2="9" y2="2.5"/>
                        </svg>
                        确认导出
                    </button>
                </div>
            </div>
        </div>
        <div class="scroll-float-btns" id="scroll-float-main">
            <button class="scroll-float-btn scroll-to-top" id="scroll-to-top" aria-label="回顶部">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
            <button class="scroll-float-btn scroll-to-bottom" id="scroll-to-bottom" aria-label="去底部">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
        </div>
    </div>
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal-dialog" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
            <div class="modal-header">
                <svg class="modal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="modal-title" id="modal-title">确认导出</span>
            </div>
            <div class="modal-body">
                <p class="modal-message" id="modal-message"></p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn modal-btn-cancel" id="modal-cancel" type="button">取消</button>
                <button class="modal-btn modal-btn-confirm" id="modal-confirm" type="button">确认导出</button>
            </div>
        </div>
    </div>
    <div class="tl-modal-overlay" id="tl-modal-overlay" style="display:none;">
        <div class="tl-modal-dialog">
            <button class="tl-modal-close" id="tl-modal-close" aria-label="关闭">×</button>
            <div class="tl-modal-category" id="tl-modal-category"></div>
            <h3 class="tl-modal-title" id="tl-modal-title"></h3>
            <div class="tl-modal-date" id="tl-modal-date"></div>
            <p class="tl-modal-desc" id="tl-modal-desc"></p>
        </div>
    </div>
    <script src="/static/app.js?v=30"></script>
</body>
</html>
